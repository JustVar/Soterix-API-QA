name: collect-gate

# Cheap merge gate: proves a change breaks no suite's imports or fixture
# wiring. Sends no live traffic. It now needs ONE credential - a read-only
# deploy key for the private shared package - collection and
# setup-plan never execute tests, and the two suites it does run are
# offline (plugin unit tests) or self-skipping (the integration suite
# skips every test when no key is set).

on:
  push:
    branches: [main]
  pull_request:

# This job only checks out and runs tests. Nothing here writes to the repo.
permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # requirements.txt now installs soterix-qa-shared from a private
      # repo over SSH. The deploy key is read-only and scoped to that repo
      # alone: it cannot push, and it cannot read this repository.
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.QA_SHARED_DEPLOY_KEY }}
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-shared.txt
      - name: Imports and fixture wiring, whole repo (root, so a stray top-level test tree is caught too)
        run: |
          pytest --collect-only
          pytest --setup-plan
      # pytest exits 5 on zero collected, so the step above already catches a
      # suite that vanishes. Nothing catches one that SHRINKS. The two API
      # surfaces are counted separately: one can lose its tests while the
      # combined number still looks healthy.
      - name: Collected-test floor
        run: python tools/collect_floor.py

      - name: Offline suites
        run: |
          pytest tests/plugins
          pytest tests/integration_api
