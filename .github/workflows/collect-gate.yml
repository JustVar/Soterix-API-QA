name: collect-gate

# The merge gate. It proves a change breaks no suite's imports or fixture
# wiring, sends no live traffic and needs no credential: collection and
# setup-plan never execute a test, the shared package installs from the
# wheel under vendor/, and the two suites it does run are offline (plugin
# unit tests) or self-skipping (the integration suite skips every test
# when no key is set).
#
# It runs on GitHub's machines only. No secret, no repository variable, no
# schedule. A push to main or a pull request starts one job.

# Each action is pinned to a commit SHA, with its version in the comment
# beside it. A tag moves: `actions/checkout@v4` is whatever that tag points
# at today. While the repo was in use, Dependabot read the comment and kept
# the pin current.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded push stands down instead of queueing behind the old one.
concurrency:
  group: collect-gate-${{ github.ref }}
  cancel-in-progress: true

# This job only checks out and runs tests. Nothing here writes to the repo.
permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      # A venv of its own, so the install below is the one a fresh clone
      # gets: the wheel from vendor/ through --find-links, nothing cached.
      - name: A venv of its own
        run: |
          python -m venv .civenv
          echo "$PWD/.civenv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - name: Imports and fixture wiring, whole repo (root, so a stray top-level test tree is caught too)
        run: |
          pytest --collect-only
          pytest --setup-plan
      # pytest exits 5 on zero collected, so the step above already catches a
      # suite that vanishes. Nothing catches one that SHRINKS. The two API
      # surfaces are counted separately: one can lose its tests while the
      # combined number still looks healthy.
      - name: Collected-test floor
        run: python tools/collect_floor.py
      # tests/plugins holds the shim guards and the shared-package pin. The
      # four internal_api files below stub their HTTP calls, so they need no
      # server: the site and camera choice, the exchange log, the session
      # cache and the login label. tests/integration_api skips every test
      # without VSAAS_INTEGRATION_KEY, so here it proves wiring, not the
      # surface.
      - name: Offline suites
        run: |
          pytest tests/plugins
          pytest tests/internal_api/test_data_choice.py tests/internal_api/test_http_exchange_log.py tests/internal_api/test_auth_cache.py tests/internal_api/test_login_label.py
          pytest tests/integration_api
      - name: Lint
        run: python -m ruff check .
