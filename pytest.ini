[pytest]
addopts = -q
# The -q above is why no pytest command in this repo should add its own.
# Two -q flags mean -qq, which suppresses the "N passed" summary line
# entirely, so a run that collected 12 tests and one that collected 597
# look the same in a CI log. tools/collect_floor.py watches the count
# instead of trusting the eye.
# One HTML report per suite, passed on the command line (see README.md):
#   pytest tests/internal_api --html=reports/internal.html --self-contained-html
#   pytest tests/integration_api --html=reports/integration.html --self-contained-html
# A fixed --html here would make every run (even --collect-only) overwrite
# one shared report file.

# Pytest's default exclusions (.* build dist ...) are REPLACED by this
# setting, not extended, so restate the ones that matter here.
norecursedirs = tools .* build dist venv node_modules *.egg

# Markers for test selection
markers =
    api: API tests
    smoke: Fast critical-path smoke tests
    positive: Positive / happy-path assertion
    negative: Negative test (invalid input, error handling)
    e2e: End-to-end multi-endpoint workflow test
    internal: Internal /v-apiserver suite (select by path tests/internal_api; only newer files carry the marker)
    integration: Third-party /v-integration-api suite (tests/integration_api)
    security: Security-focused checks (auth boundaries, session handling)
    slow: Long-running tests (> 30 seconds)
    env_qa: Tests intended to run in QA
    env_stage: Tests intended to run in Stage
    env_preprod: Tests intended to run in Pre-Prod
    env_prod: Tests intended to run in Production
    qatouch(case_key): Maps this test to a QA Touch case key (mapping file only in this repo - see AGENTS.md)
    qatouch_project(project_key): Overrides the QA Touch project key for this test
